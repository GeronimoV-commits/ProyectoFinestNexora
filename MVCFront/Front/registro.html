<html lang="es">

<head>
    <!-- Codificación, escala adaptable y título mostrado en el navegador. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- Formulario de alta de una cuenta de usuario. -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <h1 class="h3 mb-4">Crear cuenta</h1>
                <form id="form-registro">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" id="apellido" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="contraseña" class="form-label">Contraseña</label>
                        <input type="password" id="contraseña" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="repetir-contraseña" class="form-label">
                            Repetir contraseña
                        </label>
                        <input type="password" id="repetir-contraseña" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        Registrarme
                    </button>
                </form>
                <!-- registro.js coloca aquí el resultado de la operación. -->
                <p id="mensaje-registro" class="mt-3"></p>
                <a href="login.html">Ya tengo una cuenta</a>
            </div>
        </div>
    </main>
</body>
</head>
</html>
<!-- Lógica que valida campos y envía el alta al backend. -->
<script src="js/registro.js"></script>

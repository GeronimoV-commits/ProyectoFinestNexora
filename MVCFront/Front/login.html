<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Configuración básica para mostrar correctamente la página en distintos dispositivos. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Formulario que login.js envía al endpoint de autenticación. -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <h1 class="h3 mb-4">Iniciar sesión</h1>
                <form id="form-login">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="contraseña" class="form-label">Contraseña</label>
                        <input type="password" id="contraseña" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        Iniciar sesión
                    </button>
                </form>
                <!-- login.js escribe aquí los mensajes de error o de sesión. -->
                <p id="mensaje-login" class="mt-3"></p>
                <a href="index.html">Volver a la tienda</a>
            </div>
        </div>
    </main>
    <!-- Código que procesa el inicio de sesión y guarda el token. -->
    <script src="js/login.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Metadatos de idioma, codificación y diseño adaptable a móviles. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <title>Nexora</title>

</head>
<header>
    <!-- Barra de navegación con enlaces a secciones y acciones de sesión. -->
    <nav class="navbar navbar-expand-md bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Nexora</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html" id="enlace-inicio">
                        Inicio
                    </a>
                    <a class="nav-link" href="#catalogo" id="enlace-productos">
                        Productos
                    </a>
                    <a class="nav-link" href="login.html" id="enlace-login">
                        Iniciar sesión
                    </a>
                    <a class="nav-link" href="registro.html" id="enlace-registro">
                        Registrarse
                    </a>
                    <a class="nav-link d-none" href="admin.html" id="enlace-admin">
                        Administración
                    </a>
                    <button class="btn btn-outline-light d-none" id="boton-cerrar-sesion">
                        Cerrar sesión
                </div>
                <button class="btn btn-outline-light ms-2" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasCarrito">
                    Carrito
                    <span class="badge bg-danger" id="contador-carrito">
                        0
                    </span>
                </button>
                </button>

            </div>
        </div>
        </div>
    </nav>

</header>

<body class="d-flex flex-column min-vh-100">
    <!-- Sección de bienvenida con un enlace de desplazamiento al catálogo. -->
    <section id="inicio" class="py-5 bg-light">
        <div class="container text-center">

            <h1>Bienvenidos a Mi Tienda</h1>

            <p class="lead">
                Encuentra nuestros productos disponibles.
            </p>

            <a href="#catalogo" class="btn btn-primary">
                Ver productos
            </a>

        </div>

    </section>

    <!-- Contenedor que main.js llena con tarjetas de productos desde la API. -->
    <section id="catalogo" class="container py-5">

        <h2 class="text-center mb-4">
            Nuestros productos
        </h2>
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-8">
                <label for="buscador-productos" class="form-label fw-semibold">
                    Buscar productos
                </label>
                <input type="text" id="buscador-productos" class="form-control" placeholder="Buscar por nombre...">
            </div>
            <div class="col-12 col-md-4">
                <label for="filtro-categoria" class="form-label fw-semibold">
                    Categoría
                </label>

                <select id="filtro-categoria" class="form-select">
                    <option value="">
                        Todas las categorías
                    </option>
                </select>
            </div>
            <p id="mensaje-catalogo">
                Cargando productos...
            </p>
            <button class="btn btn-outline-secondary" id="boton-limpiar-filtros">
                Limpiar filtros
            </button>
            <div id="lista-productos" class="row g-4">

            </div>

    </section>

    <!-- Pie de página; mt-auto lo mantiene abajo cuando hay poco contenido. -->
    <footer class="bg-dark text-white text-center p-3  mt-auto">
        <div class="container">
            <p class="mb-0">Mi Tienda - 2026</p>
        </div>
    </footer>
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCarrito">
        <div class="offcanvas-header">
            <h2 class="offcanvas-title h5">
                Carrito de compras
            </h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas">
            </button>
        </div>
        <div class="offcanvas-body">
            <div id="lista-carrito">
                <p class="text-muted">
                    Tu carrito está vacío.
                </p>
            </div>
            <hr>
            <p class="fw-bold">
                Productos: <span id="cantidad-carrito">0</span>
            </p>
            <p class="fs-5 fw-bold">
                Total: $<span id="total-carrito">0</span>
            </p>
            <button class="btn btn-outline-danger w-100" id="boton-vaciar-carrito">
                Vaciar carrito
            </button>
        </div>
    </div>

    <!-- Bootstrap habilita componentes visuales y su comportamiento responsivo. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica del catálogo, navegación de sesión y carga de productos. -->
    <script src="js/main.js"></script>

</body>

</html>

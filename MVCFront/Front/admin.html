<html lang="es">

<head>
    <!-- Configuración básica de idioma, tamaño de pantalla y estilos. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexoa Administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <!-- Aquí se muestran las herramientas para administrar la tienda. -->
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">Nexora Administración</h1>
            <a href="index.html" class="btn btn-outline-secondary">
                Volver a la tienda
            </a>
        </div>

        <!-- En esta sección se crean, editan y consultan los productos. -->
        <section class="mb-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4">Productos</h2>
                <button class="btn btn-success" id="boton-nuevo-producto">
                    + Nuevo producto
                </button>
            </div>
            <!-- admin.js abre este formulario y lo rellena al elegir «Editar». -->
            <form id="form-producto" class="border rounded p-3 mb-4 d-none">
                <div class="mb-3">
                    <label for="nombre-producto" class="form-label">Nombre</label>
                    <input type="text" id="nombre-producto" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="descripcion-producto" class="form-label">Descripción</label>
                    <textarea id="descripcion-producto" class="form-control"></textarea>
                </div>
                <div class="mb-3">
                    <label for="precio-producto" class="form-label">
                        Precio
                    </label>
                    <input type="number" id="precio-producto" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="categoria-producto" class="form-label">
                        Categoría
                    </label>
                    <select id="categoria-producto" class="form-control" required>
                        <option value="">Seleccione una categoría</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="stock-producto" class="form-label">
                        Stock
                    </label>
                    <input type="number" id="stock-producto" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary mt-3">
                    Guardar producto
                </button>
            </form>
            <!-- admin.js muestra aquí si los productos están cargando o si ocurrió un error. -->
            <p id="mensaje-productos">Cargando productos...</p>
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <!-- admin.js agrega aquí una fila por producto. -->
                    <tbody id="tabla-productos"></tbody>
                </table>
            </div>
        </section>

        <!-- Las categorías se administran aquí y también aparecen al crear un producto. -->
        <section>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4">Categorías</h2>
                <button class="btn btn-success" id="boton-nueva-categoria">
                    + Nueva categoría
                </button>
            </div>
            <!-- Se usa el mismo formulario para crear una categoría o editarla. -->
            <form id="form-categoria" class="border rounded p-3 mb-4 d-none">
                <div class="mb-3">
                    <label for="nombre-categoria" class="form-label">
                        Nombre
                    </label>
                    <input type="text" id="nombre-categoria" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="descripcion-categoria" class="form-label">
                        Descripción
                    </label>
                    <input type="text" id="descripcion-categoria" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    Guardar categoría
                </button>
            </form>
            <!-- admin.js muestra aquí si las categorías cargaron o si hubo un error. -->
            <p id="mensaje-categorias">Cargando categorías...</p>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Categoría</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <!-- admin.js agrega aquí una fila por categoría y sus botones. -->
                    <tbody id="tabla-categorias"></tbody>
                </table>
            </div>
        </section>
        
        <!-- En esta sección se consultan, editan y desactivan cuentas. -->
        <section id="gestion-usuarios" class="container py-5">
            <h2 class="mb-4">Gestión de usuarios</h2>
            <!-- admin.js muestra este formulario al pulsar «Editar». -->
            <form id="form-usuario" class="border rounded p-3 mb-4 d-none">
                <h3 class="h5 mb-3">Editar usuario</h3>
                <div class="mb-3">
                    <label for="nombre-usuario" class="form-label">Nombre</label>
                    <input type="text" id="nombre-usuario" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="email-usuario" class="form-label">Email</label>
                    <input type="email" id="email-usuario" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="rol-usuario" class="form-label">Rol</label>
                    <select id="rol-usuario" class="form-select">
                        <!-- Los valores deben coincidir con los roles que acepta la base de datos. -->
                        <option value="user">Usuario</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">
                    Guardar cambios
                </button>
                <button type="button" class="btn btn-secondary" id="boton-cancelar-usuario">
                    Cancelar
                </button>
            </form>
            <!-- admin.js escribe aquí los mensajes de carga o error. -->
            <p id="mensaje-usuarios"></p>
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <!-- admin.js agrega aquí una fila por usuario. -->
                    <tbody id="tabla-usuarios"></tbody>
                </table>
            </div>
        </section>
    </main>
    <!-- admin.js conecta los formularios y botones con el servidor. -->
    <script src="js/admin.js"></script>
</body>

</html>

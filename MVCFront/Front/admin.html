<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">Administración</h1>
            <a href="index.html" class="btn btn-outline-secondary">
                Volver a la tienda
            </a>
        </div>

        <section class="mb-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4">Productos</h2>
                <button class="btn btn-success" id="boton-nuevo-producto">
                    + Nuevo producto
                </button>
            </div>
            <form id="form-producto" class="border rounded p-3 mb-4 d-none">
                <div class="mb-3">
                    <label for="nombre-producto" class="form-label">Nombre</label>
                    <input type="text" id="nombre-producto" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="descripcion-producto" class="form-label">Descripción</label>
                    <textarea id="descripcion-producto" class="form-control" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="precio-producto" class="form-label">
                        Precio
                    </label>
                    <input type="number" id="precio-producto" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="imagen-producto" class="form-label">
                        Imagen
                    </label>
                    <input type="url" id="imagen-producto" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="categoria-producto" class="form-label">
                        Categoría
                    </label>
                    <select id="categoria-producto" class="form-control" required>
                        <option value="">Seleccione una categoría</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="stock-producto" class="form-label">
                        Stock
                    </label>
                    <input type="number" id="stock-producto" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary mt-3">
                    Guardar producto
                </button>
            </form>
            <p id="mensaje-productos">Cargando productos...</p>
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos"></tbody>
                </table>
            </div>
        </section>

        <section>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4">Categorías</h2>
                <button class="btn btn-success" id="boton-nueva-categoria">
                    + Nueva categoría
                </button>
            </div>
            <form id="form-categoria" class="border rounded p-3 mb-4 d-none">
                <div class="mb-3">
                    <label for="nombre-categoria" class="form-label">
                        Nombre
                    </label>
                    <input type="text" id="nombre-categoria" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="descripcion-categoria" class="form-label">
                        Descripción
                    </label>
                    <input type="text" id="descripcion-categoria" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    Guardar categoría
                </button>
            </form>
            <p id="mensaje-categorias">Cargando categorías...</p>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Categoría</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-categorias"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="js/admin.js"></script>
</body>

</html>
